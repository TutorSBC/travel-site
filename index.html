<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我和老婆的旅行计划</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #fdf2f8 0%, #eff6ff 50%, #f0fdf4 100%);
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:40px 20px;
  }
  h1 { font-size:32px; color:#334155; margin-bottom:8px; }
  .sub { color:#64748b; font-size:14px; margin-bottom:40px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:24px; max-width:860px; width:100%; }
  .card {
    background:#fff; border-radius:16px; padding:28px;
    box-shadow:0 4px 20px rgba(0,0,0,.06);
    text-decoration:none; color:#1e293b;
    transition:transform .2s, box-shadow .2s;
    display:flex; flex-direction:column; gap:10px;
  }
  .card:hover { transform:translateY(-4px); box-shadow:0 8px 28px rgba(0,0,0,.12); }
  .card .emoji { font-size:36px; }
  .card .title { font-size:18px; font-weight:700; }
  .card .desc { font-size:13px; color:#64748b; line-height:1.6; }
</style>
</head>
<body>
  <h1>🎒 我和老婆的旅行计划</h1>
  <div class="sub">记录我们一起走过的每一站 ✈️</div>
  <div class="cards">
    <a class="card" href="./trip-map.html?tiles=amap">
      <span class="emoji">🗺️</span>
      <span class="title">越南 · 澳大利亚行程地图（国内版）</span>
      <span class="desc">高德地图瓦片，国内网络直接打开，无需科学上网</span>
    </a>
    <a class="card" href="./trip-map.html">
      <span class="emoji">🌍</span>
      <span class="title">越南 · 澳大利亚行程地图（国际版）</span>
      <span class="desc">OpenStreetMap 瓦片，需海外网络/科学上网</span>
    </a>
  </div>
</body>
</html>
